<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Class 7 SST - Deepak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior-y: none;
            background-color: #f8fafc; /* slate-50 */
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        
        @media (max-width: 768px) {
            ::-webkit-scrollbar {
                display: none;
            }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        
/* New Sleek Mobile Guide */
        .guide-box {
            position: absolute;
            top: 60px;
            left: 15px;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            padding: 10px 15px;
            z-index: 20; 
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 13px;
            max-width: 240px;
            animation: bounceTooltip 2s infinite;
        }
        .guide-box::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 15px;
            width: 12px;
            height: 12px;
            background: #2563eb;
            transform: rotate(45deg);
        }
        @keyframes bounceTooltip {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }    
/* Clean Professional Dark Theme */
        body { background-color: #121212 !important; color: #e0e0e0 !important; }
        header { background: #1f2937 !important; border-bottom: 1px solid #374151 !important; box-shadow: none !important; }
        #sidebar, .bg-white { background-color: #1a1a1a !important; border-color: #2d3748 !important; }
        
        /* Sirf Headings ko Cyan karna */
        h2, h3, .highlight-cyan { color: #00e5ff !important; font-weight: bold; }
        
        /* Normal text ko Light Gray karna */
        .text-slate-700, .text-slate-600 { color: #cccccc !important; }
        .text-slate-800, .text-slate-900 { color: #e0e0e0 !important; }
        
        /* Menu Buttons Design */
        .nav-badge { background-color: #374151 !important; color: #d1d5db !important; }
        .bg-blue-100 { background-color: #374151 !important; }
        .nav-btn.bg-blue-50 { background-color: #2d3748 !important; border-left: 3px solid #00e5ff; }
        .nav-btn:hover { background-color: #2d3748 !important; }
        .nav-title { color: #e0e0e0 !important; }
        
/* Video Frame & Badge */
        .video-frame {
            border: 3px solid #374151;
            border-radius: 12px;
            padding: 5px;
            background: #111827;
            position: relative;
            margin-top: 35px; /* Ye nayi line frame ko thoda neeche karegi jisse badge na kate */
            margin-bottom: 25px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .video-badge {
            position: absolute;
            top: -16px;
            left: 20px;
            background: #00e5ff;
            color: #121212;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 800;
            border-radius: 20px;
            z-index: 20;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
            letter-spacing: 0.5px;
        }
        
        /* Glide Up Animation */
        .glide-hidden { opacity: 0; transform: translateY(40px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .glide-visible { opacity: 1; transform: translateY(0); }
      /* Pro PiP Mode - Transparent Top & Outside Buttons */
        .lesson-view.has-pip { animation: none !important; transform: none !important; filter: none !important; }
        .lesson-player.has-pip { backdrop-filter: none !important; overflow: visible !important; transform: none !important; filter: none !important; }
        
        .aspect-video.pip-mode {
            position: fixed !important; bottom: 20px !important; right: 20px !important; top: auto; left: auto;
            width: 320px; height: 215px; 
            z-index: 999999 !important; 
            border: none !important; 
            outline: none !important; 
            background: transparent !important; 
            border-radius: 0 !important; 
            box-shadow: none !important;
            animation: none !important; resize: both; overflow: hidden;
            min-width: 200px; min-height: 150px; max-width: 90vw; max-height: 90vh;
        }
        
        /* FIX: Purani theme ka 1px white border aur Browser ka native resizer background hatana */
        .aspect-video.pip-mode::before { display: none !important; }
        .aspect-video.pip-mode::-webkit-resizer { background: transparent !important; border: none !important; }
        
        /* Cyan border aur shadow ab sirf video par apply hoga */
        .pip-mode > iframe, 
        .pip-mode > img, 
        .pip-mode > div:not(.pip-drag-overlay):not(.pip-controls):not(.pip-title) {
            top: 35px !important; 
            bottom: auto !important;
            height: calc(100% - 35px) !important; 
            border: 3px solid #00e5ff !important; 
            border-radius: 12px !important;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8) !important;
            box-sizing: border-box;
        }
        
        .pip-title { display: none !important; }
        
        .pip-drag-overlay { display: none; }
        .pip-mode .pip-drag-overlay { display: block; position: absolute; inset: 0; z-index: 100000; cursor: move; }
        
        /* Controls (Buttons) bilkul transparent background ke sath video ke upar float karenge */
        .pip-controls { display: none; position: absolute; top: 0px; right: 0px; gap: 8px; z-index: 100001; }
        .pip-mode .pip-controls { display: flex; }

        .pip-btn { 
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); color: white; 
            border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; 
            justify-content: center; font-size: 14px; cursor: pointer; transition: 0.2s; backdrop-filter: blur(4px);
        }
        .pip-btn:hover { background: #00e5ff; color: black; border-color: #00e5ff; transform: scale(1.1); }
        .pip-btn.close-btn:hover { background: #ff4444; border-color: #ff4444; color: white; }
        
        @media (max-width: 768px) {
            .aspect-video.pip-mode { width: 250px; height: 175px; bottom: 15px !important; right: 15px !important; }
        }
/* Scrolling Chapter Name (Marquee) */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            margin-top: 3px;
        }
        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: scrollText 10s linear infinite;
            font-size: 11px;
            color: #9ca3af; /* Halka gray colour taaki aankhon par na chubhe */
            letter-spacing: 0.5px;
        }
        @keyframes scrollText {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
        /* Chota aur Clean Guide Box */
        .guide-box {
            background: #1f2937 !important; 
            border: 1px solid #374151 !important; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.8) !important; 
            color: #e0e0e0 !important; 
            z-index: 9999 !important; /* Ye guide ko hamesha sabse aage rakhega */
        }
        .guide-box::before {
            background: #1f2937 !important; 
            border-top: 1px solid #374151 !important; 
            border-left: 1px solid #374151 !important; 
        }
        .guide-box button { color: #9ca3af !important; z-index: 10000 !important; }
</style>
    <style id="learning-studio-theme">
        :root {
            --ink: #edf5ff;
            --muted: #9fb0ca;
            --muted-2: #6d7f9d;
            --bg: #07111f;
            --surface: rgba(13, 27, 47, .82);
            --surface-solid: #0e1c31;
            --surface-2: #132844;
            --line: rgba(151, 178, 218, .15);
            --accent: #8b5cf6;
            --accent-2: #30d5c8;
            --accent-warm: #ffbd66;
            --shadow: 0 24px 70px rgba(0, 0, 0, .35);
        }
        body.day-theme {
            --ink: #15243b;
            --muted: #5b6d86;
            --muted-2: #7d8da6;
            --bg: #edf3fa;
            --surface: rgba(255, 255, 255, .78);
            --surface-solid: #ffffff;
            --surface-2: #f4f7fc;
            --line: rgba(47, 72, 107, .13);
            --shadow: 0 22px 56px rgba(48, 76, 115, .14);
        }
        * { -webkit-tap-highlight-color: transparent; }
        html { background: var(--bg); }
        body {
            background: var(--bg) !important;
            color: var(--ink) !important;
            letter-spacing: -.01em;
            overflow: hidden;
        }
        body::before, body::after {
            content: "";
            position: fixed;
            pointer-events: none;
            width: 38rem;
            height: 38rem;
            border-radius: 50%;
            filter: blur(18px);
            opacity: .18;
            z-index: -1;
            will-change: transform;
            animation: ambientDrift 18s ease-in-out infinite alternate;
        }
        body::before { background: #7447ff; top: -22rem; right: -15rem; }
        body::after { background: #00bfae; bottom: -26rem; left: -18rem; animation-delay: -8s; }
        @keyframes ambientDrift { to { transform: translate3d(-30px, 24px, 0) scale(1.08); } }
        .app-header {
            min-height: 76px;
            background: color-mix(in srgb, var(--surface-solid) 76%, transparent) !important;
            border-bottom: 1px solid var(--line) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08) !important;
            backdrop-filter: blur(20px);
        }
        .app-header > div { height: 76px !important; max-width: 1520px; margin: auto; padding: 0 22px !important; }
        .brand-orb {
            width: 38px; height: 38px; display: grid; place-items: center; border-radius: 14px;
            color: #07111f; background: linear-gradient(135deg, var(--accent-2), #78e7d9 55%, #d7fff6);
            box-shadow: 0 8px 22px rgba(48, 213, 200, .28); font-weight: 900;
        }
        .app-header h1, .app-header p { color: var(--ink) !important; }
        .app-header p { color: var(--muted) !important; letter-spacing: .12em !important; }
        .header-action {
            width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line);
            border-radius: 13px; color: var(--muted); background: var(--surface); transition: transform .22s ease, color .22s ease, background .22s ease;
        }
        .header-action:hover { transform: translateY(-2px); color: var(--ink); background: var(--surface-2); }
        .header-streak { display: flex; align-items: center; gap: 7px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 13px; color: var(--accent-warm); background: rgba(255, 189, 102, .08); font-size: 12px; font-weight: 800; }
        #sidebar, #sidebar.bg-white {
            width: 300px !important;
            background: color-mix(in srgb, var(--surface-solid) 90%, transparent) !important;
            border-color: var(--line) !important;
            box-shadow: none !important;
            backdrop-filter: blur(20px);
        }
        .sidebar-top { padding: 24px 19px 16px; border-bottom: 1px solid var(--line); }
        .sidebar-eyebrow { color: var(--accent-2); font-size: 10px; font-weight: 900; letter-spacing: .17em; text-transform: uppercase; }
        .sidebar-heading { color: var(--ink); font-size: 17px; font-weight: 800; margin-top: 4px; }
        .chapter-counter { color: var(--muted); font-size: 12px; margin-top: 3px; }
        .nav-search { width: 100%; margin-top: 17px; border: 1px solid var(--line); border-radius: 13px; padding: 10px 12px 10px 34px; outline: none; color: var(--ink); background: var(--surface-2); font-size: 12px; transition: border-color .2s ease, box-shadow .2s ease; }
        .nav-search:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 0 4px rgba(139, 92, 246, .12); }
        .search-wrap { position: relative; }
        .search-wrap svg { position: absolute; left: 11px; top: 28px; width: 14px; height: 14px; color: var(--muted-2); }
        #nav-container { background: transparent !important; padding: 13px !important; }
        .nav-btn {
            position: relative; min-height: 65px; padding: 10px !important; border: 1px solid transparent;
            border-radius: 16px !important; color: var(--ink); overflow: hidden;
            transition: transform .22s ease, border-color .22s ease, background .22s ease !important;
        }
        .nav-btn::after { content: ""; position: absolute; inset: 0; opacity: 0; background: linear-gradient(90deg, rgba(139,92,246,.12), transparent); transition: opacity .22s ease; }
        .nav-btn:hover { transform: translateX(3px); background: rgba(139, 92, 246, .07) !important; }
        .nav-btn:hover::after, .nav-btn.is-active::after { opacity: 1; }
        .nav-btn.is-active { background: linear-gradient(90deg, rgba(139,92,246,.18), rgba(48,213,200,.08)) !important; border-color: rgba(139,92,246,.28); }
        .nav-badge { z-index: 1; width: 34px !important; height: 34px !important; border-radius: 12px !important; background: var(--surface-2) !important; color: var(--muted) !important; }
        .nav-btn.is-active .nav-badge { background: linear-gradient(135deg, var(--accent), #6e81ff) !important; color: #fff !important; box-shadow: 0 7px 14px rgba(139,92,246,.22); }
        .nav-title { position: relative; z-index: 1; color: var(--ink) !important; font-size: 12px !important; }
        .nav-subtitle { position: relative; z-index: 1; display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted) !important; font-size: 11px; }
        .nav-status { position: relative; z-index: 1; margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: transparent; }
        .nav-status.done { background: var(--accent-2); box-shadow: 0 0 0 4px rgba(48,213,200,.1); }
        main { background: transparent !important; }
        #main-content { max-width: 1100px !important; padding: 28px 28px 96px; }
        .lesson-view { animation: pageEnter .48s cubic-bezier(.16,1,.3,1) both; }
        @keyframes pageEnter { from { opacity: 0; transform: translate3d(0, 14px, 0); } to { opacity: 1; transform: none; } }
        .lesson-player.has-pip { backdrop-filter: none !important; overflow: visible !important; transform: none !important; }
        .lesson-hero { position: relative; padding: 22px 4px 26px; overflow: hidden; }
        .lesson-hero::after { content: ""; position: absolute; width: 180px; height: 180px; top: -80px; right: 5%; background: radial-gradient(circle, rgba(139,92,246,.27), transparent 66%); pointer-events: none; }
        .lesson-path { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        .lesson-path .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-2); }
        .lesson-title { max-width: 800px; margin: 11px 0 8px; color: var(--ink); font-size: clamp(28px, 4vw, 43px); line-height: 1.08; font-weight: 850; letter-spacing: -.05em; }
        .lesson-description { max-width: 625px; color: var(--muted); font-size: 14px; line-height: 1.65; }
        .hero-tools { position: absolute; right: 4px; bottom: 25px; display: flex; gap: 8px; }
        .round-tool { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 13px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); transition: transform .2s ease, color .2s ease, border-color .2s ease; }
        .round-tool:hover, .round-tool.is-saved { transform: translateY(-2px); color: var(--accent-warm); border-color: rgba(255,189,102,.45); }
        .lesson-player, .summary-card, .study-tools, .lesson-navigation { border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); backdrop-filter: blur(18px); }
        .lesson-player { overflow: hidden; border-radius: 26px; }
        .player-top { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 15px 18px; border-bottom: 1px solid var(--line); }
        .player-label { display: flex; align-items: center; gap: 9px; color: var(--ink); font-size: 12px; font-weight: 800; }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef5f74; box-shadow: 0 0 0 5px rgba(239,95,116,.12); animation: pulseDot 2s ease-in-out infinite; }
        @keyframes pulseDot { 50% { transform: scale(.75); opacity: .55; } }
        .player-note { color: var(--muted); font-size: 11px; }
        .video-frame { border: 0 !important; border-radius: 0 !important; padding: 0 !important; margin: 0 !important; background: #05080e !important; box-shadow: none !important; }
        .video-badge { display: none !important; }
        .lesson-video-surface { isolation: isolate; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
        .lesson-video-surface::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; border: 1px solid rgba(255,255,255,.08); }
        .player-bottom { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 18px; color: var(--muted); font-size: 11px; }
        .player-bottom strong { color: var(--ink); font-size: 12px; }
        .player-cta { border: 0; color: var(--accent-2); font-size: 11px; font-weight: 800; background: transparent; }
        .lesson-actions { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin: 16px 0; }
        .primary-action, .subtle-action { display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 45px; padding: 0 17px; border-radius: 15px; font-size: 12px; font-weight: 800; transition: transform .2s ease, box-shadow .2s ease, background .2s ease; }
        .primary-action { color: #07111f; background: linear-gradient(135deg, var(--accent-2), #8ee9db); box-shadow: 0 10px 20px rgba(48,213,200,.19); }
        .primary-action:hover { transform: translateY(-2px); box-shadow: 0 15px 24px rgba(48,213,200,.26); }
        .primary-action.completed { color: var(--ink); background: rgba(48,213,200,.12); border: 1px solid rgba(48,213,200,.26); box-shadow: none; }
        .subtle-action { color: var(--muted); border: 1px solid var(--line); background: var(--surface); }
        .subtle-action:hover { transform: translateY(-2px); color: var(--ink); background: var(--surface-2); }
        .summary-card { margin-top: 18px; border-radius: 26px; padding: clamp(20px, 4vw, 38px); }
        .summary-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-bottom: 21px; margin-bottom: 25px; border-bottom: 1px solid var(--line); }
        .summary-kicker { color: var(--accent-2); font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .15em; }
        .summary-heading h2 { margin: 4px 0 0; color: var(--ink) !important; font-size: 23px; font-weight: 850; }
        .font-controls { display: flex; gap: 5px; }
        .font-controls button { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: var(--surface-2); font-size: 12px; }
        .summary-content { color: var(--muted) !important; font-size: var(--reading-size, 15px); line-height: 1.78; }
        .summary-content h2, .summary-content h3 { color: var(--ink) !important; letter-spacing: -.025em; }
        .summary-content h2 { font-size: 1.32em !important; margin-top: 1.55em; }
        .summary-content h3 { font-size: 1.05em !important; margin-top: 1.7em; }
        .summary-content li { color: var(--muted) !important; padding-left: 2px; }
        .summary-content strong, .summary-content .highlight-cyan { color: var(--accent-2) !important; font-weight: 750; }
        .summary-content ul { margin-top: .65em; }
        .study-tools { margin-top: 18px; overflow: hidden; border-radius: 22px; }
        .study-tools summary { cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; color: var(--ink); font-size: 13px; font-weight: 800; list-style: none; }
        .study-tools summary::-webkit-details-marker { display: none; }
        .study-tools summary span { color: var(--accent-2); font-size: 11px; }
        .notes-wrap { padding: 0 18px 18px; }
        .notes-field { width: 100%; min-height: 118px; resize: vertical; border: 1px solid var(--line); border-radius: 14px; padding: 13px; outline: none; color: var(--ink); background: var(--surface-2); font: inherit; font-size: 13px; line-height: 1.55; }
        .notes-field:focus { border-color: rgba(48,213,200,.6); box-shadow: 0 0 0 4px rgba(48,213,200,.08); }
        .notes-help { margin-top: 8px; color: var(--muted-2); font-size: 10px; }
        .lesson-navigation { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; padding: 14px; border-radius: 20px; }
        .chapter-link { display: flex; align-items: center; gap: 8px; max-width: 47%; color: var(--muted); font-size: 11px; font-weight: 700; transition: color .2s ease, transform .2s ease; }
        .chapter-link:hover { color: var(--ink); transform: translateX(-2px); }.chapter-link.next:hover { transform: translateX(2px); }.chapter-link.next { text-align: right; justify-content: flex-end; }
        .reading-progress { position: fixed; top: 0; left: 0; width: 100%; height: 3px; z-index: 60; background: transparent; }
        .reading-progress span { display: block; width: 0; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 13px rgba(48,213,200,.8); transition: width .12s linear; }
        .app-toast { position: fixed; left: 50%; bottom: 24px; z-index: 100; max-width: calc(100vw - 32px); padding: 11px 15px; color: var(--ink); border: 1px solid var(--line); border-radius: 14px; background: var(--surface-solid); box-shadow: var(--shadow); font-size: 12px; font-weight: 700; transform: translate3d(-50%, 90px, 0); opacity: 0; transition: transform .3s cubic-bezier(.16,1,.3,1), opacity .3s ease; pointer-events: none; }
        .app-toast.show { opacity: 1; transform: translate3d(-50%, 0, 0); }
        .pip-mode { border: 1px solid rgba(48,213,200,.7) !important; border-radius: 17px !important; overflow: hidden; box-shadow: 0 24px 55px rgba(0,0,0,.5) !important; animation: pipEnter .28s cubic-bezier(.16,1,.3,1) both !important; }
        @keyframes pipEnter { from { opacity: 0; transform: translate3d(0, 24px, 0) scale(.94); } to { opacity: 1; transform: translate3d(0,0,0) scale(1); } }

<script>
    setTimeout(() => {
        const box = document.getElementById("tabahi-box");
        const letter = document.getElementById("tabahi-letter");
        const word = ["A", "N", "K", "I", "T"];
        let i = 0;

        setInterval(() => {
            i++;
            
            // Box aur letter dono se purani animations hata dena
            box.className = "brand-orb"; 
            letter.className = "";
            
            // Reflow technique (browser ko naya animation chalane ke liye force karna)
            void box.offsetWidth; 
            void letter.offsetWidth; 

            if (i >= word.length) {
                // CYCLE COMPLETE: Yahan A aayega Tabahi ke sath!
                i = 0;
                letter.innerText = word[i];
                
                // Box ko hila dalne wala blast
                box.classList.add("blast-box-mode"); 
                
                // 'A' ko alag se bada aur chamakdar banana takki notice ho
                letter.classList.add("blast-letter-mode"); 
            } else {
                // Baki letters ke liye 1 se 40 tak ekdum RANDOM number nikalna
                letter.innerText = word[i];
                let randomNum = Math.floor(Math.random() * 40) + 1;
                letter.classList.add("efx-" + randomNum);
            }
        }, 800); // 0.7 seconds ki timing fix
    }, 100);

                        <h3 class="text-lg font-bold mb-2">Problems with the Barter System:</h3>
                        <ul class="list-disc pl-5 space-y-2 text-slate-700">
                            <li><span class="highlight-cyan">Double Coincidence of Wants:</span> You have to find someone who has exactly what you want AND wants exactly what you have.</li>
                            <li><span class="highlight-cyan">No Standard Measure of Value:</span> It is hard to decide how much of one item (like a bag of wheat) is a fair trade for another item (like a pair of shoes).</li>
                            <li><span class="highlight-cyan">Divisibility:</span> You cannot trade just a "part" of a live animal.</li>
                            <li><span class="highlight-cyan">Portability:</span> It is very heavy and difficult to carry things like animals or large bags of wheat around for trading.</li>
                            <li><span class="highlight-cyan">Durability:</span> Goods like wheat or vegetables can rot or be eaten by rats over time.</li>

                            <li>It acts as a <span class="highlight-cyan">Standard Measure of Value</span>, meaning everything has a set price that everyone understands.</li>
                            <li>It allows for <span class="highlight-cyan">Deferred Payments</span>, meaning you can borrow money and easily pay it back later.</li>

                            <li>Government prices can also be fixed by law so that essentials (like food grains or medicine) stay cheap and affordable for everyone.</li>
                        </ul>
                    </div>

                    <div>
                        <h3 class="text-lg font-bold mb-2">Different Types of Markets</h3>
                        <ul class="list-disc pl-5 space-y-2 text-slate-700">
                            <li><span class="highlight-cyan">Physical Markets:</span> Places where you actually visit, like weekly haats, bazaars, street shops, or digital malls.</li>
                            <li><span class="highlight-cyan">Online Markets:</span> Using apps, websites, or digital pay to buy things without leaving your house.</li>
                            <li><span class="highlight-cyan">Domestic Markets:</span> Buying and selling things inside our country's borders.</li>
                            <li><span class="highlight-cyan">International Markets:</span> Trading goods across different countries (importing means buying goods from abroad, exporting means selling goods out of our country).</li>
                        </ul>
                    </div>

                    <div>
                        <h3 class="text-lg font-bold mb-2">How Goods Reach Us (The Supply Chain)</h3>
                        <ul class="list-disc pl-5 space-y-2 text-slate-700">
                            <li><span class="highlight-cyan">Producers/Manufacturers:</span> The people who make the goods in factories or grow the crops on farms.</li>
                            <li><span class="highlight-cyan">Wholesalers:</span> They buy things in huge quantities directly from the producers and store them in big warehouses or godowns.</li>
                            <li><span class="highlight-cyan">Distributors:</span> They take and transport goods from wholesalers to small shops across different areas.</li>
                            <li><span class="highlight-cyan">Retailers:</span> The final shopkeepers where you buy goods and services directly as the final consumer.</li>
                        </ul>
                    </div>

                    <div>
                        <h3 class="text-lg font-bold mb-2">The Government's Role in Markets</h3>
                        <ul class="list-disc pl-5 space-y-2 text-slate-700">
                            <li><span class="highlight-cyan">Controlling Prices:</span> The government sets a ceiling price limit for essential things (like medicines) so that they don't become too expensive for poor people to afford, or sets a minimum support price to protect farmers.</li>
                            <li><span class="highlight-cyan">Providing Public Goods:</span> The government provides free services that may be too expensive or hard to run for profit, such as building roads, parks, and drinking water services.</li>
                            <li><span class="highlight-cyan">Stopping Bad Effects:</span> The government makes strict rules to stop companies from polluting the environment and ensures shops give the correct weights when measuring products.</li>
                        </ul>
                    </div>

                    <div>
                        <h3 class="text-lg font-bold mb-2">How to Check the Quality of Goods</h3>
                        <ul class="list-disc pl-5 space-y-2 text-slate-700">
                            <li><span class="highlight-cyan">FSSAI Mark:</span> Shows that food items and packaged food have been tested by the government and are safe to eat.</li>
                            <li><span class="highlight-cyan">ISI Mark:</span> Shows that electrical appliances and building materials are of good quality and safe to use.</li>
                            <li><span class="highlight-cyan">AGMARK:</span> Shows that agricultural products (like pulses, vegetables, or oil) have met quality standards.</li>
                            <li><span class="highlight-cyan">BEE Star Rating:</span> For energy-saving electrical appliances from 1 to 5 stars. More stars mean more energy savings.</li>
                            <li>People can also check quality by reading product labels for ingredients, net quantity, and checking expiry dates by looking at the best-before date.</li>
                        </ul>
                    </div>
                </div>
            `

            updateActiveState(id);
            document.querySelector('main').scrollTo(0, 0);

            const summary = document.getElementById('summary-container');

            // Picture-in-Picture (PiP) Scroll Logic
            const videoContainer = document.getElementById('main-video-container');
            const iframeWrapper = videoContainer.querySelector('.aspect-video');
            
            if(videoContainer && iframeWrapper) {
                const pipObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        // Agar video frame screen se bahar chala jaye, toh PiP mode on kardo
                        if(!entry.isIntersecting && window.scrollY > 200) {
                            iframeWrapper.classList.add('pip-mode');
                        } else {
                            iframeWrapper.classList.remove('pip-mode');
                        }
                    });
                }, { threshold: 0.1 });
                
                pipObserver.observe(videoContainer);
            }
        }
// Mobile Guide Logic

ading-size:${state.readingSize}px">${chapter.summary}</div></section><details id="study-tools" class="study-tools"><summary>My revision notes <span>Saved on this device</span></summary><div class="notes-wrap"><textarea id="chapter-notes" class="notes-field" placeholder="Write a short memory trick, question, or key fact…">${escapeHtml(noteFor(id))}</textarea><p class="notes-help">Notes save automatically in this browser.</p></div></details><nav class="lesson-navigation" aria-label="Lesson navigation">${previous ? `<button class="chapter-link" type="button" data-go="${previous.id}">← Ch. ${previous.id}: ${previous.title}</button>` : '<span></span>'}${next ? `<button class="chapter-link next" type="button" data-go="${next.id}">Ch. ${next.id}: ${next.title} →</button>` : '<span></span>'}</nav></article>`;

    <script id="smartphone-scroll-polish">
        (() => {
            const scrollArea = document.getElementById('content-scroller');
            let userClosedPiP = false;
            
            function flawlessPiP() {
                const playerContainer = document.getElementById('main-video-container');
                const videoSurface = playerContainer ? playerContainer.querySelector('.aspect-video') : null;
                const frame = playerContainer ? playerContainer.querySelector('.video-frame') : null;
                const lessonView = document.querySelector('.lesson-view');
                
                if (!playerContainer || !videoSurface || !frame) return;

                const rect = playerContainer.getBoundingClientRect();
                
                // NAYA FEATURE: 30% hide hone par hi mini-player appear hoga
                const triggerPoint = -(rect.height * 0.3);
                const isHidden = rect.top < triggerPoint;

                if (isHidden) {
                    if (!videoSurface.classList.contains('pip-mode') && !userClosedPiP) {
                        frame.style.height = videoSurface.offsetHeight + 'px'; 
                        videoSurface.classList.add('pip-mode');
                        playerContainer.classList.add('has-pip');
                        if(lessonView) lessonView.classList.add('has-pip'); 
                        
                        if(!videoSurface.querySelector('.pip-drag-overlay')) {
                            // Drag Area
                            const overlay = document.createElement('div');
                            overlay.className = 'pip-drag-overlay';
                            
                            // Top Bar Title
                            const title = document.createElement('div');
                            title.className = 'pip-title';
                            title.innerText = 'MINI PLAYER';

                            // Buttons Container
                            const controls = document.createElement('div');
                            controls.className = 'pip-controls';
                            
                            const fsBtn = document.createElement('button');
                            fsBtn.className = 'pip-btn'; fsBtn.innerHTML = '⛶';
                            fsBtn.title = 'Full Screen';
                            
                            const triggerFullscreen = (e) => {
                                e.stopPropagation();
                                const iframe = videoSurface.querySelector('iframe');
                                if (!iframe) return;
                                if (iframe.requestFullscreen) iframe.requestFullscreen();
                                else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
                                else if (iframe.mozRequestFullScreen) iframe.mozRequestFullScreen();
                                else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
                                else {
                                    // Mobile Safari/iOS Fallback Fix
                                    if (videoSurface.style.width === '100vw') {
                                        videoSurface.style.width = ''; videoSurface.style.height = '';
                                        videoSurface.style.top = ''; videoSurface.style.left = '';
                                        videoSurface.style.borderRadius = '12px';
                                        videoSurface.style.zIndex = '999999';
                                    } else {
                                        videoSurface.style.setProperty('width', '100vw', 'important');
                                        videoSurface.style.setProperty('height', '100vh', 'important');
                                        videoSurface.style.setProperty('top', '0', 'important');
                                        videoSurface.style.setProperty('left', '0', 'important');
                                        videoSurface.style.setProperty('border-radius', '0', 'important');
                                        videoSurface.style.setProperty('z-index', '999999999', 'important');
                                    }
                                }
                            };
                            fsBtn.onclick = triggerFullscreen;
                            fsBtn.ontouchend = (e) => { e.preventDefault(); triggerFullscreen(e); };
                            
                            const closeBtn = document.createElement('button');
                            closeBtn.className = 'pip-btn close-btn'; closeBtn.innerHTML = '❌';
                            closeBtn.title = 'Close & Pause';
                            closeBtn.onclick = (e) => { 
                                e.stopPropagation(); 
                                userClosedPiP = true; 
                                videoSurface.classList.remove('pip-mode');
                                playerContainer.classList.remove('has-pip');
                                if(lessonView) lessonView.classList.remove('has-pip');
                                frame.style.height = ''; 
                                if(window.currentPlayer && window.currentPlayer.pauseVideo) window.currentPlayer.pauseVideo();
                            };
                            
                            controls.appendChild(fsBtn);
                            controls.appendChild(closeBtn);
                            videoSurface.appendChild(title);
                            videoSurface.appendChild(overlay);
                            videoSurface.appendChild(controls);
                            
                            let isDragging = false, isPinching = false;
                            let startX, startY, initLeft, initTop;
                            let initialDistance = 0, initialWidth = 0, initialHeight = 0;

                            const startInteraction = (e) => {
                                if(e.target.tagName === 'BUTTON') return;
                                
                                // 2-Finger Zoom Shuru
                                if(e.touches && e.touches.length === 2) {
                                    isDragging = false; isPinching = true;
                                    initialDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                                    initialWidth = videoSurface.getBoundingClientRect().width;
                                    initialHeight = videoSurface.getBoundingClientRect().height;
                                    if(e.cancelable) e.preventDefault();
                                } 
                                // Hold and Drag Shuru (Kahin se bhi)
                                else if ((e.touches && e.touches.length === 1) || e.type === 'mousedown') {
                                    isDragging = true; isPinching = false;
                                    
                                    // JUMP FIX: Element ki bilkul current exact position nikalna
                                    const rect = videoSurface.getBoundingClientRect();
                                    initLeft = rect.left; 
                                    initTop = rect.top;
                                    
                                    startX = e.touches ? e.touches[0].clientX : e.clientX;
                                    startY = e.touches ? e.touches[0].clientY : e.clientY;
                                    
                                    // JUMP FIX: Drag shuru hone se theek pehle usi current jagah par element ko lock karna
                                    videoSurface.style.setProperty('left', initLeft + 'px', 'important');
                                    videoSurface.style.setProperty('top', initTop + 'px', 'important');
                                    videoSurface.style.setProperty('right', 'auto', 'important');
                                    videoSurface.style.setProperty('bottom', 'auto', 'important');
                                }
                            };

                            const moveInteraction = (e) => {
                                // Pinch Zoom Calculate (Mobile)
                                if(isPinching && e.touches && e.touches.length === 2 && initialDistance > 0) {
                                    const currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                                    const scale = currentDistance / initialDistance;
                                    let newW = initialWidth * scale;
                                    let newH = initialHeight * scale;
                                    
                                    newW = Math.max(200, Math.min(newW, window.innerWidth * 0.9));
                                    newH = Math.max(150, Math.min(newH, window.innerHeight * 0.9));
                                    
                                    videoSurface.style.setProperty('width', newW + 'px', 'important');
                                    videoSurface.style.setProperty('height', newH + 'px', 'important');
                                    if(e.cancelable) e.preventDefault();
                                } 
                                // Drag Move with Screen Boundary Lock
                                else if(isDragging) {
                                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                                    
                                    let newLeft = initLeft + (clientX - startX);
                                    let newTop = initTop + (clientY - startY);
                                    
                                    // Screen boundary ki limit
                                    const maxLeft = window.innerWidth - videoSurface.offsetWidth;
                                    const maxTop = window.innerHeight - videoSurface.offsetHeight;
                                    newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                                    newTop = Math.max(0, Math.min(newTop, maxTop));
                                    
                                    videoSurface.style.left = newLeft + 'px';
                                    videoSurface.style.top = newTop + 'px';
                                    if(e.cancelable) e.preventDefault();
                                }
                            };

                            const endInteraction = () => { isDragging = false; isPinching = false; initialDistance = 0; };
                            
                            overlay.addEventListener('mousedown', startInteraction);
                            overlay.addEventListener('touchstart', startInteraction, {passive: false});
                            window.addEventListener('mousemove', moveInteraction);
                            window.addEventListener('touchmove', moveInteraction, {passive: false});
                            window.addEventListener('mouseup', endInteraction);
                            window.addEventListener('touchend', endInteraction);
                        }
                    }
                } else {
                    userClosedPiP = false;
                    videoSurface.classList.remove('pip-mode');
                    playerContainer.classList.remove('has-pip');
                    if(lessonView) lessonView.classList.remove('has-pip');
                    frame.style.height = ''; 
                    videoSurface.style.left = ''; videoSurface.style.top = '';
                    videoSurface.style.right = ''; videoSurface.style.bottom = '';
                    videoSurface.style.width = ''; videoSurface.style.height = '';
                }
            }

            if (scrollArea) scrollArea.addEventListener('scroll', flawlessPiP, { passive: true });

            const existingLoad = window.onload;
            window.onload = () => {
                try { 
                    const pref = JSON.parse(localStorage.getItem('sst-learning-studio-v1')) || {}; 
                    if (pref.theme === 'day') document.body.classList.add('day-theme'); 
                } catch {} 
                if(existingLoad) existingLoad();
            };
        })();
    </script>
</body>
</html>
